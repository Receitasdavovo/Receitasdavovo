<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Painel de Códigos</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <header>

        <div class="header-content">

            <div>
                <strong>🔐 Painel de Acessos</strong>
                <small>
                    Gerenciamento dos códigos
                </small>
            </div>

            <a href="index.html">
                Ver site
            </a>

        </div>

    </header>


    <main>

        <section class="admin-box">

            <div class="title">

                <span>PAINEL ADMINISTRATIVO</span>

                <h1>
                    Códigos de acesso
                </h1>

                <p>
                    Gere códigos para enviar aos compradores
                    pelo WhatsApp.
                </p>

            </div>


            <div class="generator">

                <button
                    onclick="gerarCodigo()">

                    ➕ Gerar novo código

                </button>

                <div
                    id="novoCodigo"
                    class="new-code">
                </div>

            </div>


            <div class="stats">

                <div>
                    <strong id="totalCodigos">
                        0
                    </strong>

                    <span>
                        Códigos
                    </span>
                </div>

                <div>
                    <strong id="usados">
                        0
                    </strong>

                    <span>
                        Utilizados
                    </span>
                </div>

                <div>
                    <strong id="disponiveis">
                        0
                    </strong>

                    <span>
                        Disponíveis
                    </span>
                </div>

            </div>


            <div class="codes-title">

                <h2>
                    Seus códigos
                </h2>

                <button
                    onclick="limparCodigos()"
                    class="danger">

                    Limpar códigos

                </button>

            </div>


            <div
                id="codesList"
                class="codes-list">
            </div>

        </section>

    </main>


    <script src="admin.js"></script>

</body>

</html>
