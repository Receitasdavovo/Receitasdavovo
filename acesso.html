<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="robots"
        content="noindex, nofollow">

    <title>Acessar Receitas</title>

    <link rel="stylesheet" href="acesso.css">

</head>

<body>

    <main class="access-page">

        <div class="access-box">

            <div class="access-icon">
                🔐
            </div>

            <span class="tag">
                ACESSO EXCLUSIVO
            </span>

            <h1>
                Acesse suas receitas
            </h1>

            <p>
                Digite abaixo o código que você recebeu
                após a confirmação do pagamento.
            </p>


            <form id="accessForm">

                <label for="codigo">
                    Código de acesso
                </label>

                <input
                    type="text"
                    id="codigo"
                    placeholder="Ex: PF-2026-X7K9"
                    autocomplete="off"
                    required>

                <button type="submit">
                    🔓 LIBERAR RECEITAS
                </button>

            </form>


            <div
                id="mensagem"
                class="mensagem">
            </div>


            <a
                href="index.html"
                class="back">

                ← Voltar para o site

            </a>

        </div>

    </main>


    <script src="acesso.js"></script>

</body>

</html>
